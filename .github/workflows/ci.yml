name: Operaattori gates

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: operaattori-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates-0-to-9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Gate 0 — protocol and rulers
        run: python experiments/gate0_protocol_and_rulers.py
      - name: Gate 1 — order becomes morphology
        run: python experiments/gate1_order_memory.py
      - name: Gate 2 — multistability noise floor
        run: python experiments/gate2_multistability_null.py
      - name: Gate 3 — morphology becomes operator
        run: python experiments/gate3_grown_operator.py
      - name: Gate 4 — delayed consequence shapes operator
        run: python experiments/gate4_delayed_consequence.py
      - name: Gate 5 — moving matrix against explicit context
        run: python experiments/gate5_moving_operator.py
      - name: Gate 6 — out-of-family moving operator
        run: python experiments/gate6_rich_operator.py
      - name: Gate 7 — move the operator basis
        run: python experiments/gate7_rotating_basis.py
      - name: Gate 8 — learn the developmental law
        run: python experiments/gate8_meta_law.py
      - name: Gate 9 — path through operator space
        run: python experiments/gate9_lie_path.py

  real-neuron-gates-10-11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -r requirements-morphology.txt
      - name: Gate 10 unit tests
        run: python -m unittest tests.test_real_scaffold -v
      - name: Gate 10 — real neuron matrix scaffold
        run: python experiments/gate10_real_neuron_scaffold.py --no-plot
      - name: Gate 11 unit tests
        run: python -m unittest tests.test_cable_path -v
      - name: Gate 11 — passive cable path order
        run: python experiments/gate11_cable_path_order.py --no-plot

  gate12-biological-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -r requirements-morphology.txt
      - name: Gate 12 unit tests
        run: python -m unittest tests.test_order_nulls -v
      - name: Gate 12 — biological order audit
        run: python experiments/gate12_biological_order_audit.py --paths 32 --permutations 128 --constrained-permutations 48 --no-plot

  gate13-branching-transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -r requirements-morphology.txt
      - name: Gate 13 unit tests
        run: python -m unittest tests.test_tree_cable -v
      - name: Gate 13 — full branching transport
        run: python experiments/gate13_branching_transport.py --no-plot

  gate14-nmda-feedback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -r requirements-morphology.txt
      - name: Gate 14 unit tests
        run: python -m unittest tests.test_nmda_branch -v
      - name: Gate 14 — reduced NMDA branch feedback
        run: python experiments/gate14_nmda_branch_feedback.py --branches 10 --no-plot

  gate15-compartment-locality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -r requirements-morphology.txt
      - name: Gate 15 unit tests
        run: python -m unittest tests.test_tree_cable tests.test_compartment_match -v
      - name: Gate 15a — whole-branch matched locality
        run: python experiments/gate15_compartment_locality.py --branches 8 --sites 8 --min-dispersed-runs 6 --no-plot
      - name: Gate 15b — compact 50-um matched locality
        run: python experiments/gate15_compartment_locality.py --branches 8 --sites 8 --min-dispersed-runs 6 --cluster-span-um 50 --out-dir results/gate15_compact --no-plot

  gate16-released-neuron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Install released-model runtime
        run: python -m pip install neuron pandas matplotlib
      - name: Checkout pinned FCI source
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/ido4848/FCI.git /tmp/fci
          git -C /tmp/fci checkout 75ad8b4d81a7f51bf888b30650c543592340db06
          test "$(git -C /tmp/fci rev-parse HEAD)" = "75ad8b4d81a7f51bf888b30650c543592340db06"
      - name: Compile cell-1125 released mechanisms
        shell: bash
        run: |
          cd /tmp/fci/simulating_neurons/neuron_models/human/eyal/Human_L23_PC_0603_11_937_Eyal_passive_dends_simple_soma
          nrnivmodl mods
      - name: Gate 16a — released cell-1125 time-domain smoke
        run: python experiments/gate16a_fci_neuron_smoke.py --fci-root /tmp/fci
      - name: Gate 16 — released kinetic matched locality
        run: python experiments/gate16_fci_dynamic_locality.py --fci-root /tmp/fci --branches 6 --sites 3 --cluster-span-um 55
      - name: Gate 17 — same-site superposition attack
        run: python experiments/gate17_superposition_attack.py --fci-root /tmp/fci --branches 6 --sites 3 --cluster-span-um 55 --multiplicity 16
      - name: Gate 18 — Hybrid B gamma-slope attack
        run: python experiments/gate18_hybrid_b_gamma_attack.py --fci-root /tmp/fci --branches 6 --sites 3 --cluster-span-um 55 --multiplicity 16
  gate19-released-neuron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Install released-model runtime
        run: python -m pip install neuron pandas matplotlib
      - name: Checkout pinned FCI source
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/ido4848/FCI.git /tmp/fci
          git -C /tmp/fci checkout 75ad8b4d81a7f51bf888b30650c543592340db06
          test "$(git -C /tmp/fci rev-parse HEAD)" = "75ad8b4d81a7f51bf888b30650c543592340db06"
      - name: Compile cell-1125 released mechanisms
        shell: bash
        run: |
          cd /tmp/fci/simulating_neurons/neuron_models/human/eyal/Human_L23_PC_0603_11_937_Eyal_passive_dends_simple_soma
          nrnivmodl mods
      - name: Gate 19 — scaffold x temporal order
        run: python experiments/gate19_timing_order.py --fci-root /tmp/fci --branches 6 --sites 3 --cluster-span-um 55 --multiplicity 16 --lag-ms 4

  gate20-released-neuron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Install released-model runtime
        run: python -m pip install neuron pandas matplotlib
      - name: Checkout pinned FCI source
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/ido4848/FCI.git /tmp/fci
          git -C /tmp/fci checkout 75ad8b4d81a7f51bf888b30650c543592340db06
          test "$(git -C /tmp/fci rev-parse HEAD)" = "75ad8b4d81a7f51bf888b30650c543592340db06"
      - name: Compile cell-1125 released mechanisms
        shell: bash
        run: |
          cd /tmp/fci/simulating_neurons/neuron_models/human/eyal/Human_L23_PC_0603_11_937_Eyal_passive_dends_simple_soma
          nrnivmodl mods
      - name: Gate 20 — compartment modularity
        run: python experiments/gate20_compartment_modularity.py --fci-root /tmp/fci --branches 6 --sites 3 --cluster-span-um 55 --multiplicity 8

  locked-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Gate 21 is still absent
        shell: bash
        run: |
          test ! -e experiments/gate21.py
          test ! -e experiments/gate21_branch_subunit_computation.py
          test ! -e experiments/gate21_dynamic_growth.py
          echo "Gate 21 remains locked behind the Gate 20 modularity audit."
