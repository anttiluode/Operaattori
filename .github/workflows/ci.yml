name: Operaattori gates

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: operaattori-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates-0-to-9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Gate 0 — protocol and rulers
        run: python experiments/gate0_protocol_and_rulers.py
      - name: Gate 1 — order becomes morphology
        run: python experiments/gate1_order_memory.py
      - name: Gate 2 — multistability noise floor
        run: python experiments/gate2_multistability_null.py
      - name: Gate 3 — morphology becomes operator
        run: python experiments/gate3_grown_operator.py
      - name: Gate 4 — delayed consequence shapes operator
        run: python experiments/gate4_delayed_consequence.py
      - name: Gate 5 — moving matrix against explicit context
        run: python experiments/gate5_moving_operator.py
      - name: Gate 6 — out-of-family moving operator
        run: python experiments/gate6_rich_operator.py
      - name: Gate 7 — move the operator basis
        run: python experiments/gate7_rotating_basis.py
      - name: Gate 8 — learn the developmental law
        run: python experiments/gate8_meta_law.py
      - name: Gate 9 — path through operator space
        run: python experiments/gate9_lie_path.py

  real-neuron-gates-10-11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -r requirements-morphology.txt
      - name: Gate 10 unit tests
        run: python -m unittest tests.test_real_scaffold -v
      - name: Gate 10 — real neuron matrix scaffold
        run: python experiments/gate10_real_neuron_scaffold.py --no-plot
      - name: Gate 11 unit tests
        run: python -m unittest tests.test_cable_path -v
      - name: Gate 11 — passive cable path order
        run: python experiments/gate11_cable_path_order.py --no-plot

  gate12-biological-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -r requirements-morphology.txt
      - name: Gate 12 unit tests
        run: python -m unittest tests.test_order_nulls -v
      - name: Gate 12 — biological order audit
        run: python experiments/gate12_biological_order_audit.py --paths 32 --permutations 128 --constrained-permutations 48 --no-plot

  gate13-branching-transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -r requirements-morphology.txt
      - name: Gate 13 unit tests
        run: python -m unittest tests.test_tree_cable -v
      - name: Gate 13 — full branching transport
        run: python experiments/gate13_branching_transport.py --no-plot

  gate14-nmda-feedback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -r requirements-morphology.txt
      - name: Gate 14 unit tests
        run: python -m unittest tests.test_nmda_branch -v
      - name: Gate 14 — reduced NMDA branch feedback
        run: python experiments/gate14_nmda_branch_feedback.py --branches 10 --no-plot

  locked-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Gate 15 is still absent
        shell: bash
        run: |
          test ! -e experiments/gate15.py
          test ! -e experiments/gate15_neuron_nmda_time.py
          test ! -e experiments/gate15_dynamic_growth.py
          echo "Gate 15 remains locked behind the reduced NMDA audit."
