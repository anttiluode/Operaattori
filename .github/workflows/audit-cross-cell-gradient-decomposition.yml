name: Operaattori cross-cell gradient decomposition panel

on:
  push:
    branches: [main]
    paths:
      - "audits/cross_cell_gradient_decomposition.py"
      - "audits/gradient_transport_feedback.py"
      - "audits/gradient_operating_point.py"
      - "audits/real_metric_tangent.py"
      - "audits/direct_cable_graph.py"
      - "audits/causal_nonlinear_graph.py"
      - ".github/workflows/audit-cross-cell-gradient-decomposition.yml"
  workflow_dispatch:

concurrency:
  group: operaattori-cross-cell-gradient-decomposition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-cell-gradient-decomposition:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: python -m pip install numpy scipy neuron
      - name: Checkout pinned FCI source
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/ido4848/FCI.git /tmp/fci
          git -C /tmp/fci checkout 75ad8b4d81a7f51bf888b30650c543592340db06
          test "$(git -C /tmp/fci rev-parse HEAD)" = "75ad8b4d81a7f51bf888b30650c543592340db06"
      - name: Compile shared released mechanisms once
        shell: bash
        run: |
          cd /tmp/fci/simulating_neurons/neuron_models/rat/hay/Rat_L5b_PC_2_Hay_passive_dends_simple_soma
          nrnivmodl mods
      - name: Run cross-cell transport versus NMDA gradient panel
        run: python audits/cross_cell_gradient_decomposition.py --fci-root /tmp/fci
      - name: Upload JSON receipt
        uses: actions/upload-artifact@v4
        with:
          name: cross-cell-gradient-decomposition-receipt
          path: results/cross_cell_operator/cross_cell_gradient_decomposition.json
