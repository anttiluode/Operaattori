name: Operaattori 24-cell operator audit

on:
  push:
    branches: [main]
    paths:
      - "audits/cross_cell_operator.py"
      - "results/CROSS_CELL_OPERATOR_AUDIT.md"
      - ".github/workflows/audit-cross-cell-operator.yml"
  workflow_dispatch:

concurrency:
  group: operaattori-cross-cell-operator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-cell-operator:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: python -m pip install numpy neuron
      - name: Checkout pinned FCI source
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/ido4848/FCI.git /tmp/fci
          git -C /tmp/fci checkout 75ad8b4d81a7f51bf888b30650c543592340db06
          test "$(git -C /tmp/fci rev-parse HEAD)" = "75ad8b4d81a7f51bf888b30650c543592340db06"
      - name: Compile shared released mechanisms once
        shell: bash
        run: |
          cd /tmp/fci/simulating_neurons/neuron_models/rat/hay/Rat_L5b_PC_2_Hay_passive_dends_simple_soma
          nrnivmodl mods
      - name: Run 24-cell leave-one-cell-out operator audit
        run: |
          python audits/cross_cell_operator.py --fci-root /tmp/fci
      - name: Upload compact JSON receipt
        uses: actions/upload-artifact@v4
        with:
          name: cross-cell-operator-receipt
          path: results/cross_cell_operator/cross_cell_operator.json
